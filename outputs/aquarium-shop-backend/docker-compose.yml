services:
  postgres:
    image: postgres:18-alpine
    container_name: aquarium-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquarium_shop
      POSTGRES_USER: aquarium
      POSTGRES_PASSWORD: aquarium
    ports:
      - "5432:5432"
    volumes:
      - aquarium_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquarium -d aquarium_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aquarium_postgres_data:

