name: aquarium-shop

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquarium_shop}
      POSTGRES_USER: ${POSTGRES_USER:-aquarium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquarium}
    # Keep PostgreSQL private to the Compose network. Use `docker compose exec
    # postgres psql ...` for local administration instead of exposing the DB
    # port to the host/internet.
    volumes:
      # PostgreSQL 18 stores cluster data in a versioned subdirectory under
      # /var/lib/postgresql. Mounting the parent keeps upgrades safe.
      - aquarium_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The migration image retains the Prisma CLI (a dev dependency), while the
  # API image stays slim and contains runtime dependencies only.
  migrate:
    build:
      context: ./outputs/aquarium-shop-backend
      target: build
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aquarium}:${POSTGRES_PASSWORD:-aquarium}@postgres:5432/${POSTGRES_DB:-aquarium_shop}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:deploy"]

  api:
    build:
      context: ./outputs/aquarium-shop-backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aquarium}:${POSTGRES_PASSWORD:-aquarium}@postgres:5432/${POSTGRES_DB:-aquarium_shop}?schema=public
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4173,http://localhost:4174}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4174}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-before-production-0123456789abcdef}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-dev-only-refresh-pepper-change-before-production-0123456789abcdef}
      ONE_TIME_TOKEN_PEPPER: ${ONE_TIME_TOKEN_PEPPER:-dev-only-one-time-token-pepper-change-before-production-0123456789}
      MFA_ENCRYPTION_KEY_BASE64: ${MFA_ENCRYPTION_KEY_BASE64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_ISSUER: ${JWT_ISSUER:-aquarium-shop-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-aquarium-shop-web}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-aquarium_refresh}
      AUTH_MAX_FAILED_LOGINS: ${AUTH_MAX_FAILED_LOGINS:-5}
      AUTH_LOCK_MINUTES: ${AUTH_LOCK_MINUTES:-15}
      MFA_CHALLENGE_TTL_SECONDS: ${MFA_CHALLENGE_TTL_SECONDS:-300}
      EMAIL_VERIFY_TTL_SECONDS: ${EMAIL_VERIFY_TTL_SECONDS:-86400}
      PHONE_VERIFY_TTL_SECONDS: ${PHONE_VERIFY_TTL_SECONDS:-600}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-900}
      MAIL_MODE: ${MAIL_MODE:-console}
      MAIL_FROM: ${MAIL_FROM:-Aquarium Shop <no-reply@aquarium.local>}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMS_MODE: ${SMS_MODE:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      KEEP_ALIVE_TIMEOUT_MS: ${KEEP_ALIVE_TIMEOUT_MS:-5000}
      HEADERS_TIMEOUT_MS: ${HEADERS_TIMEOUT_MS:-60000}
      REQUIRE_ADMIN_MFA: ${REQUIRE_ADMIN_MFA:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-5}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-10}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MERCHANT_ID: ${PAYPAL_MERCHANT_ID:-}
      PAYPAL_SETUP_URL: ${PAYPAL_SETUP_URL:-}
      PAYPAL_INTEGRATION_MODE: ${PAYPAL_INTEGRATION_MODE:-direct}
      # Sandbox is the safe default; production must explicitly opt into live
      # credentials and pass the production environment validation checks.
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      PAYPAL_PARTNER_MERCHANT_ID: ${PAYPAL_PARTNER_MERCHANT_ID:-}
      PAYPAL_PARTNER_ATTRIBUTION_ID: ${PAYPAL_PARTNER_ATTRIBUTION_ID:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-}
      PAYPAL_PARTNER_LOGO_URL: ${PAYPAL_PARTNER_LOGO_URL:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      CARD_PROCESSOR_READY: ${CARD_PROCESSOR_READY:-false}
      PAYMENT_RESERVATION_TTL_SECONDS: ${PAYMENT_RESERVATION_TTL_SECONDS:-10800}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  web:
    build:
      context: ./outputs/aquarium-shop-dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # The same image serves both surfaces. The React router selects the
      # admin workspace at / and the customer storefront at /shop.
      - "${ADMIN_PORT:-4173}:8080"
      - "${CUSTOMER_PORT:-4174}:8080"

  # Optional one-shot admin seed. Run with:
  # docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: ./outputs/aquarium-shop-backend
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aquarium}:${POSTGRES_PASSWORD:-aquarium}@postgres:5432/${POSTGRES_DB:-aquarium_shop}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "db:seed"]

volumes:
  aquarium_postgres_data:
